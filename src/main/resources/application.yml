
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/company
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
      password:
      database: 0
  # session 必须是 spring 的直接子节点
  session:
    store-type: redis
    redis:
      namespace: webhomework:session
  mvc:
    static-path-pattern: /**
  # Spring AI 配置（通义千问）
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      # 通义千问 API Key（注意：不要提交到公开仓库，正式项目建议用环境变量 DASHSCOPE_API_KEY）
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-max  # 使用 Qwen Max 模型
          temperature: 0.7  # 创造性参数（0-1，越高越有创意）
# AI 会话记忆配置（工程化思维：参数可配置化，不硬编码）
ai:
  chat:
    max-messages: 10  # 滑动窗口大小，保留最近 N 条消息作为上下文
                      # 面试话术：太少模型忘得快，太多 Token 成本上升且可能超出上下文窗口
                      # 一般客服/聊天场景 10~20 条够用

# JWT 配置
jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation2026
  expiration: 86400000
# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.ai: debug
    com.itheima.webhomework: debug
